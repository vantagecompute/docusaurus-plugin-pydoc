name: Publish to npm

# npm is the distribution, so a release publishes one. `workflow_dispatch` stays
# for the case a release was cut before the secret existed, or a publish needs
# retrying against a tag that is already out.
#
# `NPM_TOKEN` must be a token with publish rights on the @vantagecompute scope.
# Without it the run fails loudly on the tag, which is the right failure: a
# release that silently did not publish is worse than a red run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
