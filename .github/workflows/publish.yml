name: Publish to npm

# Manual only. Consumers currently install this package as a git dependency on a
# tag rather than from npm, so a release does not need to publish anything, and
# firing this on `release: published` without an NPM_TOKEN in this repository
# would only produce a red run on every tag. Set NPM_TOKEN and run this by hand
# when npm distribution is wanted, or restore the release trigger then.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
